<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerta Barrial - Red Vecinal de Prevención</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Estilos Personales -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- PANTALLA DE ACCESO / REGISTRO RÁPIDO VECINAL -->
    <div id="auth-screen" class="fixed inset-0 z-50 bg-slate-950/95 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-amber-500/10 text-amber-500 mb-2">
                    <i class="fa-solid fa-house-chimney-crack text-2xl"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-white">Alerta Barrial</h1>
                <p class="text-xs text-slate-400 mt-0.5">Red de prevención y cuidado entre vecinos de la zona</p>
            </div>

            <!-- Tabs Login / Registro -->
            <div class="flex border-b border-slate-800 mb-4">
                <button id="tab-btn-login" onclick="switchAuthTab('login')" class="flex-1 pb-2 text-xs font-semibold text-amber-500 border-b-2 border-amber-500">Ingresar</button>
                <button id="tab-btn-register" onclick="switchAuthTab('register')" class="flex-1 pb-2 text-xs font-semibold text-slate-400 hover:text-slate-200">Registrarme</button>
            </div>

            <!-- LOGIN -->
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">WhatsApp o Email</label>
                    <input type="text" id="login-user" required placeholder="11 1234 5678" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Contraseña</label>
                    <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
                </div>
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2 shadow-lg shadow-amber-500/20 mt-2">
                    <i class="fa-solid fa-right-to-bracket"></i> Entrar y Alertar
                </button>
            </form>

            <!-- REGISTRO -->
            <form id="form-register" onsubmit="handleRegister(event)" class="space-y-3 hidden">
                <div>
                    <label class="block text-[11px] font-medium text-slate-300 mb-1">Nombre y Apellido *</label>
                    <input type="text" id="reg-fullname" required placeholder="Ej: Facundo López" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-amber-500">
                </div>

                <div>
                    <label class="block text-[11px] font-medium text-slate-300 mb-1">Celular / WhatsApp *</label>
                    <input type="tel" id="reg-phone" required placeholder="11 1234 5678" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-amber-500">
                    <span class="text-[10px] text-slate-500">Para verificar que sos vecino real del barrio.</span>
                </div>

                <div>
                    <label class="block text-[11px] font-medium text-slate-300 mb-1">Esquina o Calle donde vivís *</label>
                    <input type="text" id="reg-street" required placeholder="Ej: Simoni y Cepeda" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-amber-500">
                </div>

                <div>
                    <label class="block text-[11px] font-medium text-slate-300 mb-1">Contraseña *</label>
                    <input type="password" id="reg-password" required placeholder="Mínimo 6 caracteres" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-amber-500">
                </div>

                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2 shadow-lg shadow-amber-500/20 mt-2">
                    <i class="fa-solid fa-user-check"></i> Unirme a la Red del Barrio
                </button>
            </form>

            <div class="relative flex py-3 items-center">
                <div class="flex-grow border-t border-slate-800"></div>
                <span class="flex-shrink mx-3 text-slate-500 text-[10px] uppercase tracking-wider">O también</span>
                <div class="flex-grow border-t border-slate-800"></div>
            </div>

            <button onclick="loginAsGuest()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-2 rounded-xl text-xs transition border border-slate-700 flex items-center justify-center gap-2">
                <i class="fa-solid fa-eye text-cyan-400"></i> Ver Mapa sin Registrarme (Solo lectura)
            </button>
        </div>
    </div>

    <!-- HEADER PRINCIPAL -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 px-4 py-3 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
            <div class="bg-amber-500 text-slate-950 p-2 rounded-xl shadow-lg shadow-amber-500/20 font-bold">
                <i class="fa-solid fa-shield-halved text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-base tracking-tight text-white flex items-center gap-2">
                    Alerta Barrial <span class="text-[10px] bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded-full font-normal border border-amber-500/30">González Catán</span>
                </h1>
                <p class="text-[11px] text-slate-400">Mapa vecinal de prevención en tiempo real</p>
            </div>
        </div>

        <div class="flex items-center gap-2 flex-wrap">
            <!-- BOTÓN ALERTA RÁPIDA -->
            <button onclick="openModal('alert-modal')" class="bg-rose-600 hover:bg-rose-500 text-white px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-2 shadow-lg shadow-rose-600/30 transition animate-pulse">
                <i class="fa-solid fa-bullhorn text-sm"></i> Publicar Alerta
            </button>

            <!-- ESTADO DE USUARIO -->
            <div class="bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-xl flex items-center gap-2 text-xs">
                <i class="fa-solid fa-user text-slate-400"></i>
                <span id="user-status-label" class="text-slate-300 font-medium">Invitado</span>
                <button onclick="logout()" class="text-amber-400 hover:underline text-[10px] ml-1">Salir</button>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 h-[calc(100vh-65px)] overflow-hidden">
        
        <!-- PANEL LATERAL -->
        <section class="lg:col-span-4 bg-slate-900/60 border-r border-slate-800 flex flex-col h-full overflow-hidden">
            
            <div class="p-3 border-b border-slate-800 space-y-2 bg-slate-900/90">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-500 text-xs"></i>
                    <input type="text" id="search-input" oninput="filterIncidents()" placeholder="Buscar por calle, esquina o tipo..." class="w-full bg-slate-800 border border-slate-700 rounded-xl pl-8 pr-3 py-1.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500">
                </div>

                <!-- Botones de Filtro por Categoría -->
                <div class="grid grid-cols-4 gap-1 pt-1">
                    <button onclick="setCategoryFilter('all')" id="tab-all" class="bg-amber-500 text-slate-950 font-bold py-1 rounded-lg text-[10px]">Todos</button>
                    <button onclick="setCategoryFilter('robo')" id="tab-robo" class="bg-slate-800 text-rose-400 py-1 rounded-lg text-[10px]">Robos</button>
                    <button onclick="setCategoryFilter('sospecha')" id="tab-sospecha" class="bg-slate-800 text-amber-400 py-1 rounded-lg text-[10px]">Sospecha</button>
                    <button onclick="setCategoryFilter('acoso')" id="tab-acoso" class="bg-slate-800 text-purple-400 py-1 rounded-lg text-[10px]">Acoso</button>
                </div>
            </div>

            <!-- Listado de Novedades del Barrio -->
            <div id="incidents-list" class="flex-1 overflow-y-auto p-3 space-y-2.5">
                <!-- Se inyecta con JS -->
            </div>
        </section>

        <!-- MAPA DEL BARRIO -->
        <section class="lg:col-span-8 relative h-full">
            <div id="map" class="w-full h-full z-10"></div>
        </section>

    </main>

    <!-- MODAL PARA PUBLICAR ALERTA -->
    <div id="alert-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-slate-900 border border-amber-500/30 rounded-2xl max-w-lg w-full p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-3 border-b border-slate-800 pb-2">
                <h3 class="font-bold text-sm text-amber-400 flex items-center gap-2">
                    <i class="fa-solid fa-triangle-exclamation"></i> Registrar Alerta en el Barrio
                </h3>
                <button onclick="closeModal('alert-modal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form id="alert-form" onsubmit="submitAlert(event)" class="space-y-3">
                <div>
                    <label class="block text-[11px] font-medium text-slate-300 mb-1">Tipo de Situación *</label>
                    <select id="alert-tipo" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-amber-500">
                        <option value="Robo / Arrebato">🚨 Robo / Arrebato / Motochorro</option>
                        <option value="Actitud Sospechosa">👁️ Actitud Sospechosa / Rondando casas</option>
                        <option value="Acoso / Llegué Bien">🟣 Acoso / Intimidación en la vía pública</option>
                        <option value="Auto o Moto Sospechosa/Robada">🚗 Vehículo Sospechoso / Abandonado</option>
                        <option value="Zona Oscura / Sin Luz">💡 Luz de calle apagada / Zona oscura</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[11px] font-medium text-slate-300 mb-1">Calle y Esquina exacta *</label>
                    <input type="text" id="alert-direccion" required placeholder="Ej: Simoni y Cepeda" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-amber-500">
                </div>

                <div>
                    <label class="block text-[11px] font-medium text-slate-300 mb-1">¿Qué pasó / Qué viste? *</label>
                    <textarea id="alert-desc" rows="3" required placeholder="Detallá lo sucedido, vestimenta, vehículo o características..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-amber-500"></textarea>
                </div>

                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal('alert-modal')" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-1.5 rounded-xl text-xs">Cancelar</button>
                    <button type="submit" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-5 py-1.5 rounded-xl text-xs shadow-lg shadow-amber-500/20">Avisar a los Vecinos</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Archivo Lógica -->
    <script src="app.js"></script>
</body>
</html>
